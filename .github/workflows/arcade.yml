
name: Generate Galaga Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Galaga SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: iamBuZzy
          games: "galaga"

      - name: Verify generated SVG files
        run: |
          echo "Generated files:"
          ls -lah dist/
          test -s dist/galaga-contribution-graph.svg
          test -s dist/galaga-contribution-graph-dark.svg

      - name: Publish SVG to pacman-output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
