name: Generate Pac-Man and Galaga Contribution Graphs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate both arcade games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: iamBuZzy
          games: "pacman,galaga"
          hide_month_labels: "false"

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
